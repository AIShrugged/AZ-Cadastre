name: Release

# Собирает три образа и публикует их в Docker Hub. Идёт после того, как CI на
# `main` стал зелёным — не параллельно с ним: незачем публиковать сборку,
# которая не прошла проверки. Ручной запуск (workflow_dispatch) — на случай
# пересборки без нового коммита.
#
# Выката отсюда нет намеренно: контейнеры на стенде обновляются вручную.
# Публикуются два тега — `latest`, который тянет compose, и SHA коммита, на
# который можно откатиться, когда latest поехал не туда.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Только если CI действительно прошёл (или это ручной запуск).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      # Один сломанный образ не должен отменять сборку двух других: иначе в
      # отчёте два «cancelled» вместо ответа, собираются они или нет.
      fail-fast: false
      matrix:
        include:
          - image: cadastre-web
            dockerfile: apps/web/Dockerfile
          - image: cadastre-core
            dockerfile: apps/server/Dockerfile
          - image: cadastre-registry
            dockerfile: apps/registry-stub/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Тег коммита рядом с latest: latest — то, что тянет compose, а SHA — то,
      # на что можно откатиться, когда latest поехал не туда.
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ekalkutin/${{ matrix.image }}:latest
            ekalkutin/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
