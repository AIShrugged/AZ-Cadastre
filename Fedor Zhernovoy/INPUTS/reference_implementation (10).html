<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference Implementation — Document Compliance Verification</title>
<style>
:root{--navy:#1B2A41;--gold:#C9A227;--grey:#F5F6F8;--line:#DCE0E6;--muted:#5B6B79;
--ok-bg:#EAF3DE;--ok-fg:#173404;--eh-bg:#E6F1FB;--eh-fg:#042C53;
--wn-bg:#FAEEDA;--wn-fg:#633806;--dg-bg:#FCEBEB;--dg-fg:#501313}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--navy);background:#fff}
header{background:var(--navy);color:#fff;padding:16px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px}
header h1{margin:0;font-size:17px;font-weight:600}
header p{margin:4px 0 0;font-size:12.5px;color:#C8D0DA}
.lang{display:flex;border:1px solid #3A4A61;border-radius:6px;overflow:hidden;flex:none}
.lang button{background:transparent;color:#C8D0DA;border:0;padding:7px 15px;font:600 12.5px inherit;cursor:pointer;border-radius:0}
.lang button.on{background:var(--gold);color:var(--navy)}
.bar{background:var(--gold);height:4px}
.wrap{display:grid;grid-template-columns:410px 1fr;min-height:calc(100vh - 88px)}
.panel{border-right:1px solid var(--line);padding:20px;overflow-y:auto;max-height:calc(100vh - 88px)}
.out{padding:20px 26px;overflow-y:auto;max-height:calc(100vh - 88px)}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:22px 0 10px;font-weight:600}
h2:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 3px}
.row{margin-bottom:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input[type=number],input[type=date]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;font:13px inherit;background:#fff;color:var(--navy)}
.chk{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12.5px}
.chk input{margin-top:3px;flex:none}
.sub{padding-left:22px;border-left:2px solid var(--line);margin:2px 0 8px 6px}
button{background:var(--navy);color:#fff;border:0;border-radius:5px;padding:9px 14px;font:600 13px inherit;cursor:pointer}
button.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
button:hover{opacity:.9}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:8px 15px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--navy);border-bottom-color:var(--gold)}
.card{border:1px solid var(--line);border-radius:7px;margin-bottom:11px;overflow:hidden}
.card>.hd{background:var(--grey);padding:8px 12px;font-weight:600;font-size:13px}
.card>.bd{padding:10px 12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:7px 9px;font-weight:600;font-size:11.5px}
td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11.5px;font-weight:600}
.p-ok{background:var(--ok-bg);color:var(--ok-fg)}
.p-eh{background:var(--eh-bg);color:var(--eh-fg)}
.p-wn{background:var(--wn-bg);color:var(--wn-fg)}
.p-dg{background:var(--dg-bg);color:var(--dg-fg)}
.banner{border-radius:7px;padding:13px 15px;margin-bottom:18px;font-size:13.5px}
.b-ok{background:var(--ok-bg);color:var(--ok-fg)}
.b-wn{background:var(--wn-bg);color:var(--wn-fg)}
.b-dg{background:var(--dg-bg);color:var(--dg-fg)}
.banner b{display:block;margin-bottom:3px;font-size:15px}
.path{background:var(--grey);border-radius:6px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.8;margin-bottom:10px}
.def{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.def:last-child{border-bottom:0}
.def span{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.hit{background:#FFF8E1}
.note{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6}
.dash{color:#B4BCC6}
.pass{color:var(--ok-fg);font-weight:600}
.fail{color:var(--dg-fg);font-weight:600}
pre{background:var(--grey);padding:12px;border-radius:6px;overflow-x:auto;font-size:11.5px;margin:0}
</style>
</head>
<body>
<header>
  <div><h1 id="hT"></h1><p id="hS"></p></div>
  <div style="display:flex;gap:10px;align-items:center;flex:none">
  <select id="cat" onchange="if(this.value==='apt')window.location.href='reference_implementation_apartment.html'"
    style="background:#121D2E;color:#fff;border:1px solid #3A4A61;border-radius:6px;padding:7px 10px;font:600 12.5px inherit">

    <option value="apt" disabled>Mənzil / Apartment — hazırlanır</option>
  </select>
  <div class="lang">
    <button data-l="az" onclick="setLang('az')">AZ</button>
    <button data-l="en" class="on" onclick="setLang('en')">EN</button>
    <button data-l="ru" onclick="setLang('ru')">RU</button>
  </div>
  </div>
</header>
<div class="bar"></div>

<div class="wrap">
<div class="panel">
  <h2 id="h_preset"></h2>
  <div class="row"><select id="preset"></select></div>
  <div class="row"><button class="alt" style="width:100%" id="btnPreset" onclick="loadPreset()"></button></div>

  <h2 id="h_params"></h2>

  <div class="row"><label id="l_dateSrc"></label><select id="dateSrc"></select></div>
  <div class="row"><label id="l_date"></label>
    <div class="g2"><select id="dateKnown"></select><input type="date" id="cdate" value="2014-06-01"></div></div>
  <div class="g2">
    <div class="row"><label id="l_storeys"></label><input type="number" id="storeys" value="2" min="0"></div>
    <div class="row"><label id="l_height"></label><input type="number" id="height" value="7.4" step="0.1"></div>
  </div>
  <div class="g2">
    <div class="row"><label id="l_span"></label><input type="number" id="span" value="4.2" step="0.1"></div>
    <div class="row"><label id="l_landRight"></label><select id="landRight"></select></div>
  </div>
  <div class="row"><label id="l_purpose"></label><select id="purpose"></select><div class="note" id="n_empty"></div></div>

  <h2 id="h_art10"></h2>
  <div class="row"><label id="l_1022"></label><select id="d1022"></select></div>
  <div class="row"><label id="l_1023"></label><select id="d1023"></select></div>
  <div class="row"><label id="l_1024"></label><select id="d1024"></select></div>

  <h2 id="h_ground"></h2>
  <div id="ownerNote" class="card"><div class="bd" id="t_ownerNote"></div></div>
  <div id="groundPick" style="display:none">
    <div class="row"><label id="l_gitem"></label><select id="gitem"></select></div>
    <div class="row"><label id="l_gdate"></label><input type="date" id="gdate" value="1995-05-12"></div>
    <div class="chk"><input type="checkbox" id="gpresent" checked><span id="t_gpresent"></span></div>
    <div class="sub">
      <div class="chk"><input type="checkbox" id="gAuthority" checked><span id="t_gAuth"></span></div>
      <div class="chk"><input type="checkbox" id="gRequisites" checked><span id="t_gReq"></span></div>
      <div class="chk"><input type="checkbox" id="gArchive" checked><span id="t_gArch"></span></div>
      <div class="row" id="qrRow"><label id="l_gQR"></label><select id="gQR"></select></div>
    </div>
  </div>

  <h2 id="h_docs"></h2>
  <div id="docs"></div>

  <h2 id="h_ind"></h2>
  <div class="chk"><input type="checkbox" id="licenceValid" checked><span id="t_lic"></span></div>
  <div class="chk"><input type="checkbox" id="notifRegistered"><span id="t_notifReg"></span></div>

  <h2 id="h_cross"></h2>
  <div class="chk"><input type="checkbox" id="cName" checked><span id="t_cName"></span></div>
  <div class="chk"><input type="checkbox" id="cAddr" checked><span id="t_cAddr"></span></div>
  <div class="g2">
    <div class="row"><label id="l_aPass"></label><input type="number" id="aPass" value="148.6" step="0.1"></div>
    <div class="row"><label id="l_aDes"></label><input type="number" id="aDes" value="152.0" step="0.1"></div>
  </div>
  <div style="margin-top:18px"><button style="width:100%" id="btnRun" onclick="run()"></button></div>
</div>

<div class="out">
  <div class="tabs">
    <div class="tab on" data-t="report" onclick="tab('report')"></div>
    <div class="tab" data-t="rules" onclick="tab('rules')"></div>
    <div class="tab" data-t="tests" onclick="tab('tests')"></div>
    <div class="tab" data-t="docs" onclick="tab('docs')"></div>
    <div class="tab" data-t="src" onclick="tab('src')"></div>
    <div class="tab" data-t="json" onclick="tab('json')"></div>
  </div>
  <div id="report"></div><div id="rules" style="display:none"></div>
  <div id="tests" style="display:none"></div><div id="docs_tab" style="display:none"></div>
  <div id="src" style="display:none"></div>
  <div id="json" style="display:none"></div>
</div>
</div>

 "8.0.10.1":[["ground"],["permit"],["archPlan"],["opPermit"]],
 "8.0.10.2":[["ground"],["archPlan"],["notif"]]};
const RULES=[
 {ref:"8.0.9.1.1",c:{date:"<=2012-12-31",height:"<=12",landRight:"lease,use"}},
 {ref:"8.0.9.1.2",c:{date:"<=2012-12-31",height:"<=12",landRight:"ownership",purpose:"residential"}},
 {ref:"8.0.9.2",c:{date:"<=2012-12-31",height:">12"}},
 {ref:"8.0.10.2",c:{date:">=2013-01-01",storeys:"<=3",height:"<=12",span:"<=6",purpose:"residential"}},
 {ref:"8.0.10.1",c:{date:">=2013-01-01"}}];
const COLS=["date","storeys","height","span","landRight","purpose"];
const colh=c=>({date:t("l_date"),storeys:t("l_storeys"),height:t("l_height"),span:t("l_span"),
 landRight:t("l_landRight"),purpose:t("l_purpose")})[c];

function evalCond(f,e,p){
 const v=p[f];
 if(v===null||v===undefined||v==="unknown")return null;
 if(f==="date"){const op=e.slice(0,2),lim=e.slice(2);return op==="<="?v<=lim:v>=lim;}
 if(f==="landRight"||f==="purpose")return e.split(",").includes(v);
 const mm=e.match(/^(<=|>=|<|>)(.+)$/),n=parseFloat(mm[2]);
 return mm[1]==="<="?v<=n:mm[1]===">="?v>=n:mm[1]==="<"?v<n:v>n;}

function determineGround(p){
 const ev=RULES.map(r=>{const res={};let ex=false,un=false;
  for(const[f,e]of Object.entries(r.c)){const v=evalCond(f,e,p);res[f]=v;if(v===false)ex=true;if(v===null)un=true;}
  return{ref:r.ref,res,excluded:ex,unknown:un,full:!ex&&!un};});
 const open=ev.filter(e=>!e.excluded);
 if(!open.length)return{status:"none",evaluated:ev,candidates:[],noneSpecific:isUncovered(p)};
 const cs=[];for(const e of open){cs.push(e);if(e.full)break;}
 if(cs.length===1&&cs[0].full)return{status:"determined",ground:cs[0].ref,evaluated:ev,candidates:cs};
 return{status:"multiple",evaluated:ev,candidates:cs,
  divergence:cs.flatMap(c=>Object.entries(c.res).filter(([,v])=>v===null).map(([f])=>f)).filter((v,i,a)=>a.indexOf(v)===i)};}
const isUncovered=p=>!!(p.date&&p.date<="2012-12-31"&&p.height!==null&&p.height<=12&&p.landRight==="ownership"&&p.purpose==="other");

function checkGroundDoc(p,refs){
 if(!p.groundPresent)return{status:"absent"};
 const it=GROUND_ITEMS.find(i=>i.ref===p.groundItem);
 if(!it)return{status:"absent"};
 const notes=[];let st="ok";
 if(it.mqs)return{status:"ok",item:it,date:p.groundDate,notes:[],mqs:true};
 if(it.max&&p.groundDate>=it.max){st="invalid";notes.push(m("dateMax",it.ref,fmt(it.max),fmt(p.groundDate)));}
 if(it.min&&p.groundDate<it.min){st="invalid";notes.push(m("dateMin",it.ref,fmt(it.min),fmt(p.groundDate)));}
 for(const r of (refs||[])){const need=GCLASS[r];
  if(need&&it.cls!==need){st="invalid";notes.push(m("wrongClass",r,it.ref));}}
 const needArch=/^[12]\./.test(it.ref);
 let qrState=null;
 if(needArch){
  if(!p.gArchive){st="invalid";notes.push(m("noArchive",it.ref));}
  else if(p.gQR==="failed"){st="invalid";notes.push(m("qrFailed"));}
  else if(p.gQR==="absent"){qrState="operator";}
 }
 if(!p.gRequisites){st="invalid";notes.push(m("noRequisites",it.ref));}
 if(!p.gAuthority){st="invalid";notes.push(m("noAuthority",it.ref));}
 return{status:st,item:it,date:p.groundDate,notes,qrState,needArch};}
const fmt=d=>{const[y,mo,dd]=d.split("-");return`${dd}.${mo}.${y}`;};
const gdLabel=gd=>gd.mqs?t("t_ownerNote"):gd.item?`${gd.item.ref} — ${gd.item.n[L]} · ${fmt(gd.date)}`:"—";

function verify(p){
 const g=determineGround(p);
 const refs0=g.status==="determined"?[g.ground]:g.status==="multiple"?g.candidates.map(c=>c.ref):[];
 const gd=checkGroundDoc(p,refs0);
 const art10=[
  {ref:"10.2.1",name:{az:"Maddə 8 üzrə əsas",en:"Ground under Article 8",ru:"Основание по статье 8"},st:gd.status==="absent"?"absent":"present"},
  {ref:"10.2.2",name:{az:"Torpaq sahəsinin planı və ölçüsü",en:"Plan and dimensions of the land plot",ru:"План и размеры земельного участка"},st:p.d1022},
  {ref:"10.2.3",name:{az:"Eskiz layihə (texniki sənəd)",en:"Sketch design (technical document)",ru:"Эскизный проект (технический документ)"},st:p.d1023},
  {ref:"10.2.4",name:{az:"Dövlət rüsumunun ödənilməsi",en:"Payment of the state duty",ru:"Уплата государственной пошлины"},st:p.d1024}];
 const refs=refs0;
 const perRef={};
 for(const r of refs)perRef[r]=(REQUIREMENTS[r]||[]).map(grp=>{
  const opts=grp.map(k=>k==="ground"?{key:"ground",ok:gd.status==="ok"}:{key:k,ok:!!(p.docs[k]&&p.docs[k].present)});
  return{opts,satisfied:opts.some(o=>o.ok)};});
 const defs=[];
 for(const a of art10)if(a.st==="absent"&&a.ref!=="10.2.1")defs.push({t:m("artMissing",a.ref,a.name[L].toLowerCase()),s:a.ref});
 if(gd.status==="absent")defs.push({t:m("groundMissing"),s:"10.2.1"});
 if(gd.status==="invalid")gd.notes.forEach(n=>defs.push({t:n,s:`439 · ${gd.item.ref}`}));
 for(const r of refs)for(const grp of perRef[r])if(!grp.satisfied){
  const names=grp.opts.filter(o=>o.key!=="ground").map(o=>dname(o.key).toLowerCase());
  if(names.length&&!(grp.opts.length===1&&grp.opts[0].key==="notif"))
   defs.push({t:m("provMissing",r,names.join(" "+t("or_")+" ")),s:r});}
 const ap=p.docs.archPlan||{present:false,subs:{}},apReq=refs.some(r=>(REQUIREMENTS[r]||[]).flat().includes("archPlan"));
 if(ap&&ap.present&&apReq){
  if(!ap.subs.composition)defs.push({t:m("archIncomplete"),s:"ŞTM/UPCC 80.1"});
  if(!ap.subs.signatures)defs.push({t:m("archSign"),s:"—"});
  if(!p.licenceValid)defs.push({t:m("licenceInvalid"),s:"Lisenziyalar portalı"});}
 if(gd.qrState==="operator")ops.push(m("qrAbsent"));
 const ops=[];
 if(g.status==="multiple")ops.push(m("confirmGround"));
 const notifReq=refs.includes("8.0.10.2");
 let notifMode=null;
 if(notifReq&&p.date){notifMode=p.date>="2025-06-01"?"api":"letter";}
 const ad=Math.abs(p.aPass-p.aDes);
 const cons=[{key:"f_name",ok:p.cName},{key:"f_addr",ok:p.cAddr},
  {key:"f_land",ok:ad<0.05,val:`${p.aPass} m² / ${p.aDes} m²`,diff:ad.toFixed(1)}];
 const notifDoc=!!(p.docs.notif&&p.docs.notif.present);
 if(notifMode==="api"&&!notifDoc&&!p.notifRegistered)defs.push({t:m("notifApi"),s:"ŞTM 80.6"});
 if(notifMode==="letter"&&!notifDoc)defs.push({t:m("notifLetter"),s:"8.0.10.2"});
 if(!p.cName)defs.push({t:m("fieldDiff",t("f_name")),s:t("cross_check")});
 if(!p.cAddr)defs.push({t:m("fieldDiff",t("f_addr")),s:t("cross_check")});
 if(ad>=0.05)defs.push({t:m("landDiff",ad.toFixed(1)),s:t("cross_check")});
 const decision=g.status==="none"?"ground_not_determined":defs.length===0?(ops.length?"recommend_with_checks":"recommend"):"return_for_correction";
 return{params:p,ground:g,groundDoc:gd,art10,perRef,refs,deficiencies:defs,operatorChecks:ops,consistency:cons,decision};}

const pill=st=>{const map={present:["p-ok","p_present"],ehis:["p-eh","p_ehis"],absent:["p-dg","p_absent"],mqs:["p-eh","p_mqs"],later:["p-wn","p_later"],
 ok:["p-ok","p_ok"],invalid:["p-dg","p_invalid"]};const[c,k]=map[st]||["p-wn",st];
 return`<span class="pill ${c}">${T[L][k]||st}</span>`;};

const P_=(p,k)=>!!(p.docs&&p.docs[k]&&p.docs[k].present);
const SRCOF=p=>({
 coord: p.d1022==="present"||p.d1022==="mqs" ? "doc":"operator",
 dims: (P_(p,"archPlan")||P_(p,"design")) ? "doc":"operator",
 right: p.groundPresent ? "doc":"operator"});
const srcLbl=(k,p)=>{const s=SRCOF(p);
 if(k==="coord")return s.coord==="doc"?t("src_landplan"):t("cs_op");
 if(k==="dims")return s.dims==="doc"?t("src_design"):t("cs_op");
 return s.right==="doc"?t("src_title"):t("cs_op");};
function render(R){
 const p=R.params;
 const D={recommend:["b-ok",t("d_recommend"),t("d_recommend_sub")],
  recommend_with_checks:["b-wn",t("d_checks"),t("d_checks_sub")],
  return_for_correction:["b-wn",t("d_return"),""],ground_not_determined:["b-dg",t("d_none"),""]}[R.decision];
 let sub=D[2];
 if(R.decision==="return_for_correction")sub=`${R.deficiencies.length} ${t("deficiency")}, ${R.operatorChecks.length} ${t("opcheck")}. `
  +(R.ground.status==="determined"?`${t("ground_is")} ${R.ground.ground}.`:t("ground_open"));
 if(R.decision==="ground_not_determined")sub=R.ground.noneSpecific?t("none_specific"):t("none_generic");
 let h=`<div class="banner ${D[0]}"><b>${D[1]}</b>${sub}</div>`;

 h+=`<div class="card"><div class="hd">${t("s1")}</div><div class="bd"><table>`
  +`<tr><th style="width:28%">${t("c_param")}</th><th style="width:22%">${t("c_value")}</th><th>${t("c_source")}</th></tr>`;
 const prm=[[t("l_date"),p.date?fmt(p.date):null,t("ds_"+(p.dateSrc||"ge"))],
  [t("l_storeys"),p.storeys,srcLbl("dims",p)],
  [t("l_height"),p.height!==null?p.height+" m":null,srcLbl("dims",p)],
  [t("l_span"),p.span!==null?p.span+" m":null,srcLbl("dims",p)],
  [t("l_landRight"),p.landRight==="unknown"?null:t(p.landRight),srcLbl("right",p)],
  [t("l_purpose"),p.purpose==="unknown"?null:t(p.purpose),srcLbl("right",p)]];
 for(const[k,v,s]of prm)h+=`<tr><td>${k}</td><td>${v===null||v===undefined?`<span class="pill p-dg">${t("p_notest")}</span>`:v}</td><td style="color:var(--muted)">${s}</td></tr>`;
 h+=`</table></div></div>`;

 const S=SRCOF(p);
 h+=`<div class="card"><div class="hd">${t("s_date")}</div><div class="bd"><table>`
  +((p.dateSrc||"ge")==="ge"
    ?`<tr><td style="width:34%">${t("l_coord")}</td><td style="width:24%" class="mono">${p.coord||"—"}</td>`
     +`<td style="color:var(--muted)">${S.coord==="doc"?t("src_landplan"):t("cs_op")}</td></tr>`
     +`<tr><td>${t("l_epochs")}</td><td class="mono">${p.epochs||"—"}</td><td style="color:var(--muted)">Google Earth API</td></tr>`
    :"")
  +`<tr><td style="width:34%">${t("l_date")}</td><td style="width:24%">${p.date?fmt(p.date):`<span class="pill p-dg">${t("p_notest")}</span>`}</td>`
  +`<td style="color:var(--muted)">${t("ds_"+(p.dateSrc||"ge"))}</td></tr></table>`
  +`<div class="note">${(p.dateSrc||"ge")==="ge"?t("n_ge"):t("n_dsalt")}</div></div></div>`;
 const need=[];
 if(S.coord==="operator")need.push(t("need_coord"));
 if(S.dims==="operator")need.push(t("need_dims"));
 if(S.right==="operator")need.push(t("need_right"));
 if(need.length)h+=`<div class="card"><div class="hd">${t("s_need")}</div><div class="bd">`
  +`<div class="note" style="margin:0 0 8px">${t("n_need")}</div>`
  +need.map((x,i)=>`<div class="def">${i+1}. ${x}</div>`).join("")+`</div></div>`;
 h+=`<div class="card"><div class="hd">${t("s2")}</div><div class="bd"><table>`
  +`<tr><th style="width:11%">${t("c_prov")}</th><th>${t("c_doc")}</th><th style="width:26%">${t("c_status")}</th></tr>`;
 for(const a of R.art10)h+=`<tr><td class="mono">${a.ref}</td><td>${a.name[L]}</td><td>${pill(a.st)}</td></tr>`;
 h+=`</table></div></div>`;

 h+=`<div class="card"><div class="hd">${t("s3")}</div><div class="bd"><div class="path">${pathText(p)}</div>`;
 if(R.ground.status==="determined")h+=`<div><b>${t("res_one")}: ${R.ground.ground}</b> — ${t("res_one2")}</div>`;
 else if(R.ground.status==="multiple"){
  h+=`<div><b>${t("res_one")}: ${R.ground.candidates.length} ${t("res_multi")}</b> — ${R.ground.candidates.map(c=>c.ref).join(" / ")}. `
   +`${t("res_multi2")} ${R.ground.divergence.map(d=>colh(d).toLowerCase()).join(", ")}.</div>`+compareTable(R);
 }else h+=`<div><b>${t("res_none")}</b> ${R.ground.noneSpecific?t("none_specific"):t("none_generic")}</div>`;
 h+=`</div></div>`;

 if(R.refs.length){
  h+=`<div class="card"><div class="hd">${t("s4")}</div><div class="bd">`;
  for(const r of R.refs){
   if(R.refs.length>1)h+=`<div style="font-weight:600;margin:8px 0 5px">${t("under_")} ${r}</div>`;
   h+=`<table>`;
   for(const grp of R.perRef[r]){
    const names=grp.opts.map(o=>dname(o.key)).join(` &nbsp;<i>${t("or_")}</i>&nbsp; `);
    const isG=grp.opts.some(o=>o.key==="ground");
    const st=grp.satisfied?(isG&&R.groundDoc.status==="invalid"?"invalid":"ok"):"absent";
    h+=`<tr><td>${names}${isG?`<span style="display:block;color:var(--muted);font-size:11.5px;margin-top:2px">${gdLabel(R.groundDoc)}</span>`:""}</td><td style="width:26%">${pill(st)}</td></tr>`;}
   h+=`</table>`;}
  h+=`</div></div>`;}

 h+=`<div class="card"><div class="hd">${t("s5")}</div><div class="bd"><table>`
  +`<tr><th style="width:30%">${t("c_data")}</th><th>${t("c_cmp")}</th><th style="width:26%">${t("c_res")}</th></tr>`;
 for(const c of R.consistency)h+=`<tr><td>${t(c.key)}</td><td>${c.val||(c.ok?t("v_same"):t("v_diff"))}</td>`
  +`<td>${c.ok?`<span class="pill p-ok">${t("p_consistent")}</span>`:`<span class="pill p-wn">${c.diff?t("v_diffby")+" "+c.diff+" m²":t("v_diff")}</span>`}</td></tr>`;
 h+=`</table></div></div>`;

 h+=`<div class="card"><div class="hd">${t("s6")}</div><div class="bd">`;
 if(!R.deficiencies.length&&!R.operatorChecks.length)h+=`<div style="color:var(--muted)">${t("def_none")}</div>`;
 R.deficiencies.forEach((d,i)=>h+=`<div class="def">${i+1}. ${d.t}<span>${d.s}</span></div>`);
 R.operatorChecks.forEach((o,i)=>h+=`<div class="def">${R.deficiencies.length+i+1}. ${o}<span>${t("op_check")}</span></div>`);
 h+=`</div></div>`;
 document.getElementById("report").innerHTML=h;
 renderContract(R);
 renderRules(R);}

function pathText(p){
 const a=[];
 a.push(p.date===null?t("pth_nodate"):(p.date<="2012-12-31"?t("pth_pre"):t("pth_post")));
 if(p.storeys!==null)a.push(`${t("pth_st")} ${p.storeys}`);
 a.push(p.height===null?t("pth_noh"):`${t("pth_h")} ${p.height} m`);
 if(p.span!==null)a.push(`${t("pth_sp")} ${p.span} m`);
 if(p.landRight!=="unknown")a.push(`${t("pth_lr")} ${t(p.landRight)}`);
 if(p.purpose!=="unknown")a.push(`${t("pth_pu")} ${t(p.purpose)}`);
 return a.join(" · ");}

function compareTable(R){
 const all=[...new Set(R.refs.flatMap(r=>(REQUIREMENTS[r]||[]).map(g=>g.join("|"))))];
 let h=`<table style="margin-top:10px"><tr><th>${t("c_doc")}</th>${R.refs.map(r=>`<th>${r}</th>`).join("")}</tr>`;
 for(const key of all){
  h+=`<tr><td>${key.split("|").map(dname).join(` ${t("or_")} `)}</td>`;
  for(const r of R.refs){
   const grp=(R.perRef[r]||[]).find(g=>g.opts.map(o=>o.key).join("|")===key);
   h+=`<td>${!grp?`<span class="dash">${t("p_notreq")}</span>`:grp.satisfied?`<span class="pill p-ok">${t("p_req_present")}</span>`:`<span class="pill p-dg">${t("p_req_absent")}</span>`}</td>`;}
  h+=`</tr>`;}
 return h+`</table>`;}

function renderRules(R){
 const cand=R?(R.ground.status==="determined"?[R.ground.ground]:R.ground.candidates.map(c=>c.ref)):[];
 let h=`<div class="card"><div class="hd">${t("dt_title")}</div><div class="bd"><table>`
  +`<tr><th>#</th>${COLS.map(c=>`<th>${colh(c)}</th>`).join("")}<th>${t("c_prov")}</th></tr>`;
 RULES.forEach((r,i)=>{
  h+=`<tr class="${cand.includes(r.ref)?"hit":""}"><td class="mono">${i+1}</td>`;
  for(const c of COLS){let e=r.c[c];
   if(e&&(c==="landRight"||c==="purpose"))e=e.split(",").map(x=>t(x)).join(", ");
   h+=`<td class="mono">${e?e:`<span class="dash">—</span>`}</td>`;}
  h+=`<td class="mono"><b>${r.ref}</b></td></tr>`;});
 h+=`</table><div class="note">${t("dt_note")}</div></div></div>`;
 h+=`<div class="card"><div class="hd">${t("dr_title")}</div><div class="bd"><table>`
  +`<tr><th style="width:16%">${t("c_prov")}</th><th>${t("c_doc")}</th></tr>`;
 for(const[r,gs]of Object.entries(REQUIREMENTS))
  h+=`<tr class="${cand.includes(r)?"hit":""}"><td class="mono"><b>${r}</b></td><td>`
   +gs.map(g=>g.map(dname).join(` <i>${t("or_")}</i> `)).join("<br>")+`</td></tr>`;
 h+=`</table><div class="note">${t("dr_note")}</div></div></div>`;
 h+=`<div class="card"><div class="hd">${t("dc_title")}</div><div class="bd"><table>`
  +`<tr><th style="width:10%">${t("c_prov")}</th><th>${t("c_doc")}</th><th style="width:24%">${t("c_constraint")}</th></tr>`;
 for(const i of GROUND_ITEMS)h+=`<tr><td class="mono">${i.ref}</td><td>${i.n[L]}</td><td class="mono">${
  i.min&&i.max?fmt(i.min)+" – "+fmt(i.max):i.max?t("before_")+" "+fmt(i.max):i.min?t("after_")+" "+fmt(i.min):`<span class="dash">—</span>`}</td></tr>`;
 h+=`</table></div></div>`;
 document.getElementById("rules").innerHTML=h;}

function runTests(){
 let pass=0;
 let h=`<div class="card"><div class="hd">${t("ts_title")} — ${FIXTURES.length} ${t("ts_cases")}</div><div class="bd"><table>`
  +`<tr><th style="width:40%">${t("c_case")}</th><th>${t("c_expg")}</th><th>${t("c_actg")}</th><th>${t("c_expd")}</th><th>${t("c_actd")}</th><th>${t("c_result")}</th></tr>`;
 for(const f of FIXTURES){
  const R=verify(f.p),ag=R.ground.status==="determined"?R.ground.ground:null;
  const ok=ag===f.e.ground&&R.decision===f.e.decision;if(ok)pass++;
  h+=`<tr><td>${f.n[L]}</td><td class="mono">${f.e.ground||"—"}</td><td class="mono">${ag||"—"}</td>`
   +`<td class="mono">${f.e.decision}</td><td class="mono">${R.decision}</td><td class="${ok?"pass":"fail"}">${ok?"PASS":"FAIL"}</td></tr>`;}
 h+=`</table><div class="note">${t("ts_note")}</div></div></div>`;
 document.getElementById("tests").innerHTML=
  `<div class="banner ${pass===FIXTURES.length?"b-ok":"b-dg"}"><b>${pass} / ${FIXTURES.length} ${t("ts_pass")}</b>${t("ts_self")}</div>`+h;}

function downloadContract(){
 const blob=new Blob([JSON.stringify(buildContract(),null,2)],{type:"application/json;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download="acceptance_fixtures.json";a.click();URL.revokeObjectURL(a.href);}

function renderSources(){
 const tx=v=>typeof v==="string"?v:(v?v[L]:null);
 let h=`<div class="card"><div class="hd">${t("src_title")}</div><div class="bd"><table>`
  +`<tr><th style="width:20%">${t("src_c1")}</th><th style="width:33%">${t("src_c2")}</th><th style="width:30%">${t("src_c3")}</th><th>${t("src_c4")}</th></tr>`;
 for(const r of SOURCES){
  const ig=r.i==="OK"?`<span class="pill p-ok">${t("exists")}</span>`
    :r.i?`<span class="pill p-wn">${tx(r.i)}</span>`:`<span class="dash">${t("na")}</span>`;
  h+=`<tr><td><b>${r.e[L]}</b></td><td>${r.s[L]}</td><td>${r.f?r.f[L]:`<span class="dash">${t("na")}</span>`}</td><td>${ig}</td></tr>`;}
 h+=`</table><div class="note">${t("src_note")}</div></div></div>`;
 h+=`<div class="card"><div class="hd">${t("ind_title")}</div><div class="bd"><table>`
  +`<tr><th style="width:6%">${t("ind_c1")}</th><th>${t("ind_c2")}</th><th style="width:26%">${t("ind_c3")}</th></tr>`;
 INDICATORS.forEach((x,i)=>{h+=`<tr><td class="mono">${i+1}</td><td>${x.n[L]}</td><td>${tx(x.a)}</td></tr>`;});
 h+=`</table></div></div>`;
 document.getElementById("src").innerHTML=h;}

function renderCalc(){
 let h=`<div class="card"><div class="hd">${t("calc_title")}</div><div class="bd">`
  +`<div class="note" style="margin:0 0 12px">${t("calc_note")}</div>`;
 CALC.forEach((c,i)=>{
  h+=`<div style="border-top:0.5px solid var(--border);padding-top:12px;margin-top:12px">`
   +`<div style="font-weight:600;font-size:13px;margin-bottom:5px">${i+1}. ${c.t[L]}</div>`
   +`<div style="font-size:13px;margin-bottom:8px">${c.d[L]}</div>`
   +`<table style="margin-bottom:8px">`
   +c.st[L].map((x,j)=>`<tr><td class="mono" style="width:6%">${j+1}</td><td>${x}</td></tr>`).join("")
   +`</table>`
   +`<div style="background:var(--bg-warning);color:#633806;border-radius:var(--radius);padding:9px 11px;font-size:12.5px">${c.w[L]}</div>`
   +`</div>`;});
 return h+`</div></div>`;}

function renderDocs(){
 const tx=v=>typeof v==="string"?v:(v?v[L]:null);
 let h=`<div class="card"><div class="hd">${t("dfx_title")}</div><div class="bd"><table>`
  +`<tr><th style="width:22%">${t("c_doc")}</th><th style="width:16%">${t("dfx_refs")}</th>`
  +`<th>${t("dfx_fields")}</th><th style="width:14%">${t("c_src2")}</th></tr>`;
 for(const d of DOCFIELDS){
  h+=`<tr><td><b>${d.n[L]}</b></td><td class="mono">${d.refs.join("<br>")}</td><td>`
   +d.f.map(x=>"• "+x[L]).join("<br>")+`</td><td>`
   +(d.src?`<span class="pill p-eh">${tx(SRCLABEL[d.src])}</span>`:`<span class="dash">${t("dfx_upload")}</span>`)
   +`</td></tr>`;}
 h+=`</table><div class="note">${t("dfx_note")}</div></div></div>`;
 h+=renderCalc();
 h+=`<div class="card"><div class="hd">${t("exp_title")}</div><div class="bd">`
  +`<p style="margin:0 0 10px;font-size:13px">${t("exp_note")}</p>`

 document.getElementById("docs_tab").innerHTML=h;}

function exportTemplate(){
 const rows=[XL.hdr[L].slice()];
 const groundDocs=r=>DOCFIELDS.filter(d=>d.refs.includes(r)&&(d.id==="extract"||d.id==="decree439"));
 RULES.forEach((r,i)=>{
  const groups=REQUIREMENTS[r.ref]||[];
  groups.forEach((grp,gi)=>{
   const docsFor=k=>k==="ground"
     ? (groundDocs(r.ref).length?groundDocs(r.ref):[DOCFIELDS.find(d=>d.id==="extract")])
     : [DOCFIELDS.find(d=>d.id===DOCMAP[k])].filter(Boolean);
   const names=grp.map(k=>docsFor(k).map(d=>d.n[L]).join(" / ")).join(" "+XL.or[L]+" ");
   const flds=grp.map(k=>docsFor(k).map(d=>d.f.map(f=>f[L]).join("; ")).join(" | ")).join(" | ");
   const chk=grp.map(k=>docsFor(k).map(d=>(XL.chk[d.id]||{})[L]||"").filter(Boolean).join(" | "))
     .filter(Boolean).join(" | ");
   rows.push([gi===0?String(i+1):"",gi===0?XL.proc[L]:"",gi===0?XL.art[L](r.ref):"",
    names,flds,gi===0?XL.param[L]:"",gi===0?XL.cond[r.ref][L]:"",
    gi===0&&r.ref==="8.0.10.1"?XL.fallback[L]:"",chk,XL.act[L]]);});
  const pr=XL.pkgRow[L].slice();
  const lp=DOCFIELDS.find(d=>d.id==="landplan");
  rows.push([pr[0],pr[1],pr[2],pr[3],lp.f.map(f=>f[L]).join("; "),pr[4],pr[5],pr[6],pr[7],XL.act[L]]);});
 downloadXlsx(rows,XL.sheet[L],XL.file[L]);}

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
 for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
const enc=s=>new TextEncoder().encode(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function sheetXml(rows){
 const col=i=>{let s="",n=i+1;while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;};
 let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
  +`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>`
  +`<col min="1" max="1" width="10"/><col min="2" max="2" width="38"/><col min="3" max="3" width="26"/>`
  +`<col min="4" max="4" width="42"/><col min="5" max="5" width="70"/><col min="6" max="6" width="34"/>`
  +`<col min="7" max="7" width="46"/><col min="8" max="8" width="46"/><col min="9" max="9" width="52"/>`
  +`<col min="10" max="10" width="46"/></cols><sheetData>`;
 rows.forEach((r,ri)=>{x+=`<row r="${ri+1}">`;
  r.forEach((c,ci)=>{x+=`<c r="${col(ci)}${ri+1}" t="inlineStr" s="${ri===0?1:0}"><is><t xml:space="preserve">${esc(c)}</t></is></c>`;});
  x+=`</row>`;});
 return x+`</sheetData></worksheet>`;}

  "xl/_rels/workbook.xml.rels":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
  "xl/styles.xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1B2A41"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs></styleSheet>`,
  "xl/worksheets/sheet1.xml":sheetXml(rows)};
 const parts=[],cd=[];let off=0;
 for(const name of Object.keys(files)){
  const nb=enc(name),db=enc(files[name]),c=crc32(db);
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
  lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0,true);
  lh.setUint32(14,c,true);lh.setUint32(18,db.length,true);lh.setUint32(22,db.length,true);
  lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
  parts.push(new Uint8Array(lh.buffer),nb,db);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
  ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0,true);
  ch.setUint32(16,c,true);ch.setUint32(20,db.length,true);ch.setUint32(24,db.length,true);
  ch.setUint16(28,nb.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
  ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
  cd.push(new Uint8Array(ch.buffer),nb);
  off+=30+nb.length+db.length;}
 const cdSize=cd.reduce((a,b)=>a+b.length,0);
 const eo=new DataView(new ArrayBuffer(22));
 eo.setUint32(0,0x06054b50,true);eo.setUint16(8,Object.keys(files).length,true);
 eo.setUint16(10,Object.keys(files).length,true);eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);
 const blob=new Blob([...parts,...cd,new Uint8Array(eo.buffer)],
  {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;a.click();
 URL.revokeObjectURL(a.href);}

const opt=(v,l,s)=>`<option value="${v}"${s?" selected":""}>${l}</option>`;

function paintUI(){
 document.documentElement.lang=L;
 document.getElementById("hT").textContent=t("title");
 document.getElementById("hS").textContent=t("sub");
 ["h_preset","h_params","h_art10","h_ground","h_docs","h_cross","l_date","l_storeys","l_height","l_span",
  "l_landRight","l_purpose","n_empty","l_1022","l_1023","l_1024","l_gitem","l_gdate","l_aPass","l_aDes",
  "l_coord","l_epochs","l_dateSrc","h_ind"]
  .forEach(k=>{const el=document.getElementById(k);if(el)el.textContent=t(k);});
 document.getElementById("btnPreset").textContent=t("btnPreset");
 document.getElementById("btnRun").textContent=t("btnRun");
 document.getElementById("t_ownerNote").textContent=t("t_ownerNote");
 document.getElementById("t_gpresent").textContent=t("t_gpresent");
 document.getElementById("t_cName").textContent=t("t_cName");
 document.getElementById("t_cAddr").textContent=t("t_cAddr");
 ["t_gAuth","t_gReq","t_gArch","l_gQR","t_lic","t_notifReg"].forEach(k=>{const e=document.getElementById(k);if(e)e.textContent=t(k);});
 document.querySelectorAll(".tab").forEach(el=>el.textContent=t("tab_"+el.dataset.t));
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
 const k=id=>document.getElementById(id).value;
 const vD=k("dateKnown"),vL=k("landRight"),vP=k("purpose"),v2=k("d1022"),v3=k("d1023"),v4=k("d1024"),vG=k("gitem"),vS=k("preset");
 document.getElementById("dateKnown").innerHTML=opt("1",t("known"),vD==="1")+opt("0",t("unknown_opt"),vD==="0");
 const vDS=k("dateSrc");
 document.getElementById("dateSrc").innerHTML=["ge","doc","operator"].map(x=>opt(x,t("ds_"+x),vDS===x)).join("");
 document.getElementById("landRight").innerHTML=["ownership","lease","use"].map(x=>opt(x,t(x),vL===x)).join("")+opt("unknown",t("unknown_opt"),vL==="unknown");
 document.getElementById("purpose").innerHTML=["residential","other"].map(x=>opt(x,t(x),vP===x)).join("")+opt("unknown",t("unknown_opt"),vP==="unknown");
 document.getElementById("d1022").innerHTML=["mqs","package","absent"].map(x=>opt(x,t("o_"+x),v2===x)).join("");
 document.getElementById("d1023").innerHTML=["package","absent"].map(x=>opt(x,t("o_"+x),v3===x)).join("");
 document.getElementById("d1024").innerHTML=["later","package"].map(x=>opt(x,t("o_"+x),v4===x)).join("");
 document.getElementById("gitem").innerHTML=GROUND_ITEMS.map(i=>opt(i.ref,`${i.ref} — ${i.n[L].slice(0,46)}${i.n[L].length>46?"…":""}`,vG===i.ref)).join("");
 const vQ=k("gQR");
 document.getElementById("gQR").innerHTML=["ok","absent","failed"].map(x=>opt(x,t("qr_"+x),vQ===x)).join("");
 document.getElementById("preset").innerHTML=FIXTURES.map((f,i)=>opt(i,f.n[L],vS==String(i))).join("");
 const st={};
 for(const key of Object.keys(DOC_DEFS)){
  const el=document.getElementById("doc_"+key);st[key]={p:el?el.checked:false,s:{}};
  if(DOC_DEFS[key].subs)for(const s of DOC_DEFS[key].subs){
   const se=document.getElementById("sub_"+key+"_"+s.k);st[key].s[s.k]=se?se.checked:true;}}
 let dh="";
 for(const[key,d]of Object.entries(DOC_DEFS)){
  dh+=`<div class="chk"><input type="checkbox" id="doc_${key}"${st[key].p?" checked":""}><span>${d.n[L]}</span></div>`;
  if(d.subs){dh+=`<div class="sub">`;
   for(const s of d.subs)dh+=`<div class="chk"><input type="checkbox" id="sub_${key}_${s.k}"${st[key].s[s.k]?" checked":""}><span>${s.n[L]}</span></div>`;
   dh+=`</div>`;}}
 document.getElementById("docs").innerHTML=dh;
 bind();}

function setLang(l){L=l;paintUI();syncGround();run();runTests();renderSources();renderDocs();}
const num=id=>{const v=document.getElementById(id).value;return v===""?null:parseFloat(v);};

function collect(){
 const docs={};
 for(const k of Object.keys(DOC_DEFS)){
  const el=document.getElementById("doc_"+k);const d={present:el?el.checked:false,subs:{}};
  if(DOC_DEFS[k].subs)for(const s of DOC_DEFS[k].subs){
   const se=document.getElementById("sub_"+k+"_"+s.k);d.subs[s.k]=se?se.checked:false;}
  docs[k]=d;}
 const g=id=>document.getElementById(id).value;
 return{coord:g("coord"),epochs:g("epochs"),dateSrc:g("dateSrc"),
  date:g("dateKnown")==="1"?g("cdate"):null,storeys:num("storeys"),height:num("height"),span:num("span"),
  landRight:g("landRight"),purpose:g("purpose"),
  d1022:g("d1022")==="package"?"present":g("d1022"),
  d1023:g("d1023")==="package"?"present":"absent",
  d1024:g("d1024")==="package"?"present":"later",
  groundItem:g("gitem"),groundDate:g("gdate"),groundPresent:document.getElementById("gpresent").checked,
  gAuthority:document.getElementById("gAuthority").checked,gRequisites:document.getElementById("gRequisites").checked,
  gArchive:document.getElementById("gArchive").checked,gQR:document.getElementById("gQR").value,
  licenceValid:document.getElementById("licenceValid").checked,
  notifRegistered:document.getElementById("notifRegistered").checked,docs,
  cName:document.getElementById("cName").checked,cAddr:document.getElementById("cAddr").checked,
  aPass:num("aPass"),aDes:num("aDes")};}

function syncGround(){
 document.getElementById("ownerNote").style.display="none";
 document.getElementById("groundPick").style.display="";
 const it=GROUND_ITEMS.find(i=>i.ref===document.getElementById("gitem").value);
 const isD=it&&/^[12]\./.test(it.ref);
 document.getElementById("gArchive").parentElement.style.display=isD?"":"none";
 document.getElementById("qrRow").style.display=isD?"":"none";
 document.getElementById("gdate").parentElement.style.display=(it&&it.mqs)?"none":"";}

function loadPreset(){
 const p=FIXTURES[+document.getElementById("preset").value].p,s=(i,v)=>document.getElementById(i).value=v;
 s("dateKnown",p.date?"1":"0");if(p.date)s("cdate",p.date);
 s("storeys",p.storeys??"");s("height",p.height??"");s("span",p.span??"");
 s("landRight",p.landRight);s("purpose",p.purpose);
 s("d1022",p.d1022==="present"?"package":p.d1022);
 s("d1023",p.d1023==="present"?"package":"absent");
 s("d1024",p.d1024==="present"?"package":p.d1024);
 s("gitem",p.groundItem);s("gdate",p.groundDate);
 document.getElementById("gpresent").checked=p.groundPresent;
 ["gAuthority","gRequisites","gArchive","licenceValid","notifRegistered"].forEach(k=>{
  const e=document.getElementById(k);if(e)e.checked=!!p[k];});
 document.getElementById("gQR").value=p.gQR||"ok";
 s("coord",p.coord||"");s("epochs",p.epochs||"");s("dateSrc",p.dateSrc||"ge");
 for(const k of Object.keys(DOC_DEFS)){
  document.getElementById("doc_"+k).checked=!!(p.docs[k]&&p.docs[k].present);
  if(DOC_DEFS[k].subs)for(const sb of DOC_DEFS[k].subs)
   document.getElementById("sub_"+k+"_"+sb.k).checked=!!(p.docs[k]&&p.docs[k].subs[sb.k]);}
 document.getElementById("cName").checked=p.cName;
 document.getElementById("cAddr").checked=p.cAddr;
 s("aPass",p.aPass);s("aDes",p.aDes);
 syncGround();run();}

function tab(x){
 ["report","rules","tests","docs","src","json"].forEach(k=>document.getElementById(k==="docs"?"docs_tab":k).style.display=k===x?"":"none");
 document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("on",el.dataset.t===x));}

function bind(){
 document.querySelectorAll(".panel input, .panel select").forEach(el=>{
  el.onchange=()=>{if(el.id==="landRight")syncGround();if(el.id!=="preset")run();};});}

function run(){render(verify(collect()));}

paintUI();syncGround();loadPreset();runTests();renderSources();renderDocs();
</script>
