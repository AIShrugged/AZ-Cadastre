server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # The whole file travels through this nginx on its way to storage, and
    # nginx's default is 1m: above it the browser gets a 413 the app never sees
    # coming, for a file the app itself had already accepted. It sits at server
    # level rather than in the one location that carries bytes today — a limit
    # that only covers the path someone remembered is a limit that fails the
    # next time a path is added. Keep it at or above MAX_MB in
    # apps/web/src/features/upload-documents/lib/file.ts.
    client_max_body_size 50m;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss;
    
    # Proxy API requests to backend service (like Vite does)
    # "^~" stops nginx from testing the regex locations below: without it a
    # request ending in .js/.png would fall into the static-asset block and be
    # looked for on disk instead of being proxied.
    location ^~ /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Proxy S3 bucket requests to RustFS (like Vite does)
    # This keeps the browser on same origin and avoids CORS issues
    # NOTE: Host header must match what S3Client signed with (rustfs:9000)
    # "^~" is required: page images are .png keys, and a plain prefix location
    # loses to the static-asset regex below, which served them off disk (404).
    location ^~ /documents/ {
        # Stream to RustFS instead of spooling the file to disk first.
        proxy_request_buffering off;
        proxy_pass http://rustfs:9000/documents/;
        proxy_http_version 1.1;
        proxy_set_header Host rustfs:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Proxy the archive register (apps/registry-stub), the way Vite does at
    # /registry in vite.config.ts. The two go together: the register's workbook
    # import is deliberately outside @cadastre/api-contracts, so the client
    # calls the register directly rather than through the gateway (ADR-0011 §1,
    # TECH_DEBT §10), and a dev-only proxy makes that route exist on a developer's
    # machine and nowhere else.
    #
    # Without this block the request falls to the SPA fallback below, and nginx
    # answers a POST to a static file with 405 Not Allowed — which says nothing
    # about a missing route and is what it actually said (COMM-19).
    #
    # "^~" for the same reason as the two above: it stops the static-asset regex
    # from testing the request first.
    location ^~ /registry/ {
        proxy_pass http://registry:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host registry;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The register holds the whole workbook in memory and writes it in one
        # transaction, whose own ceiling is two minutes (ADR-0011). nginx waits
        # 60s by default, so a large file would be cut off mid-import and the
        # operator told nothing about whether the records went in.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Cache static assets
    location ~* \.(js|css|png|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # SPA routing - redirect all 404s to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Don't log favicon and robots.txt
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
