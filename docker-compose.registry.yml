---
name: cadastre-registry

services:
  registry:
    image: ekalkutin/cadastre-registry:latest
    container_name: registry-stub
    ports:
      - '3100:3100'
    restart: unless-stopped
    env_file: .env.registry
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Schema only; seed with: docker exec registry-stub pnpm db:seed
  migrate:
    image: ekalkutin/cadastre-migrator:latest
    command: ['registry']
    restart: 'no'
    env_file: .env.registry
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: registry-stub-postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file: .env.registry
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: registry-stub-rustfs
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs-data:/data
    env_file: .env.registry
    restart: unless-stopped

volumes:
  postgres-data:
    name: registry-stub-postgres-data
  rustfs-data:
    name: registry-stub-rustfs-data
